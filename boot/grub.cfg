# GRUB2 configuration for PXE boot (UEFI)
# Greeting shown at startup
set timeout=15
set default=0

# Graphics (optional, falls back to text if unavailable)
insmod all_video
insmod gfxterm
insmod font
if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi

# A friendly banner
echo "=============================================="
echo "  Welcome to the PXE Server boot menu"
echo "  Use the arrow keys to choose an entry"
echo "=============================================="

menuentry "Linux LTS 6.18.35 (default)" --class linux {
    echo "Booting Linux LTS 6.18.35 ..."
    linux  /vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage quiet
    initrd /initramfs-lts
}

menuentry "Linux LTS 6.18.35 (verbose)" --class linux {
    echo "Booting Linux LTS 6.18.35 (verbose) ..."
    linux  /vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage
    initrd /initramfs-lts
}

# ISO entries are generated by the server (it can list /isos, GRUB over TFTP
# cannot): pxesrv rewrites this block on startup and on every DHCP DISCOVER.
# >>> ISOS (generated by pxesrv - do not edit, rewritten automatically) >>>
menuentry "(No ISO images in /isos)" --class info {
    echo "Place .iso files in /isos and reboot to see them here."
    sleep 3
}
# <<< ISOS <<<

menuentry "Reboot" --class restart {
    reboot
}

menuentry "Power off" --class shutdown {
    halt
}

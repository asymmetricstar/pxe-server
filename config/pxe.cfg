# PXE Server - single configuration file for all services
#
# ${SERVER_ROOT} = the distribution root, i.e. the parent of the directory
# that contains this file (build/bin when running from build/bin/config).

[server]
host = 0.0.0.0           # 0.0.0.0 = listen on all interfaces (DHCP broadcasts
                         # must be answered on whichever NIC receives them)
port = 67                # DHCP port (67 = standard, needs admin/root)
server_ip =              # empty = auto-detect the local IPv4 address
boot_root = ${SERVER_ROOT}/boot
boot_file = undionly.kpxe
boot_file_efi = grub/grubx64.efi  # UEFI NBP (GRUB2 netboot image)

[dhcp]
range_start =          # empty = auto (server subnet .100)
range_end =            # empty = auto (server subnet .199)
subnet_mask = 255.255.255.0
router =               # empty = auto (server subnet .1)
dns =                  # empty = auto (server subnet .1)
domain = local.home
lease_time = 21600       # seconds

[tftp]
port = 69                # TFTP port (69 = standard, needs admin/root)
timeout = 3              # per-block retransmit timeout, seconds (kept short:
                         # 30 made every stalled transfer hang for minutes)
max_clients = 50
blksize = 1456           # maximum TFTP blksize we grant in option negotiation.
                         # 1456 fits one TFTP datagram inside a 1500-byte MTU
                         # (IP+UDP+TFTP headers); smaller values just waste RTTs.

[http]
port = 80                # HTTP port (0 disables the HTTP service)
root = ${SERVER_ROOT}/boot

[logging]
level = info             # debug | info | warning | error
file = ${SERVER_ROOT}/logs/pxe.log
